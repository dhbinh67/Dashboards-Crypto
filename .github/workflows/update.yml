name: Update data
on:
  schedule:
    - cron: "5 0,4,8,12,16,20 * * *"   # 7:05, 11:05, 15:05, 19:05, 23:05, 3:05 giờ VN
  workflow_dispatch:                    # cho phép bấm chạy tay
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git commit -m "Update data $(date -u +%F_%H%M)" || echo "no changes"
          git push
